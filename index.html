Join the Literature Club and Meet Adorable Characters
Step into the role of a new club member and spend your afternoons with four adorable anime friends. Each character has a unique personality: there’s a cheerful best friend, a shy bookworm, a spunky manga lover, and a confident club president leading the group. Share poems, chat after school, and build bonds with each club member. You’ll feel like you’re part of a sweet circle of friends in this story-driven adventure.

Write Poems &amp; Shape Your Story
In each chapter, write a poem by picking your favorite words to impress your favorite club member. Every choice you make – from which club member to spend time with to the poems you create – helps shape your personal story. This dating sim for browser offers special scenes and heartwarming moments with the club member you grow closest to.
